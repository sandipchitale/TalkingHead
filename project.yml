name: TalkingHead
options:
  bundleIdPrefix: com.sandipchitale
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.0.5"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # The same MCP SDK (and version) as VoiceChat.
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
  # Already a dependency of the MCP SDK; named here for the menu bar app's HTTP server.
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.65.0
targets:
  TalkingHead:
    type: application
    platform: macOS
    sources:
      - path: TalkingHead
      # The MCP tools, shared with `th-mcp`.
      - path: MCPTools
      # The `th` command-line script, copied next to the app executable (Contents/MacOS).
      - path: CLI/th
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - package: MCP
      - package: NIO
        product: NIOCore
      - package: NIO
        product: NIOPosix
      - package: NIO
        product: NIOHTTP1
      # The stdio MCP server, copied next to the app executable (Contents/MacOS) and signed.
      - target: th-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    scheme:
      testTargets: [TalkingHeadTests]
    info:
      path: TalkingHead/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # talkinghead://speak?text=…|url=…[&voice=male|female]
        CFBundleURLTypes:
          - CFBundleURLName: com.sandipchitale.TalkingHead
            CFBundleURLSchemes: [talkinghead]
        # Services → "Speak with Talking Head" for selected text or links.
        NSServices:
          - NSMenuItem:
              default: Speak with Talking Head
            NSMessage: speakSelection
            NSPortName: TalkingHead
            NSSendTypes: [public.utf8-plain-text, public.url]
            NSRequiredContext: {}
        # Pages to read may be plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    postBuildScripts:
      # Nested code in Contents/MacOS must be signed before Xcode signs the app.
      - name: Sign th
        script: codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/th"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sandipchitale.TalkingHead
        PRODUCT_NAME: TalkingHead
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Talking Head
        # A menu bar applet: no Dock icon or app menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Off so `th` can read any file passed on the command line.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  # The stdio MCP server. It speaks by running the `th` beside it.
  th-mcp:
    type: tool
    platform: macOS
    sources:
      - path: CLI/th-mcp
      - path: MCPTools
    dependencies:
      - package: MCP
    settings:
      base:
        PRODUCT_NAME: th-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.sandipchitale.TalkingHead.th-mcp
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
  TalkingHeadTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TalkingHeadTests]
    dependencies:
      - target: TalkingHead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sandipchitale.TalkingHeadTests
        GENERATE_INFOPLIST_FILE: YES
