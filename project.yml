name: TalkingHead
options:
  bundleIdPrefix: com.sandipchitale
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TalkingHead:
    type: application
    platform: macOS
    sources:
      - path: TalkingHead
      # The `th` command-line script, copied next to the app executable (Contents/MacOS).
      - path: CLI/th
        buildPhase:
          copyFiles:
            destination: executables
    scheme:
      testTargets: [TalkingHeadTests]
    postBuildScripts:
      # Nested code in Contents/MacOS must be signed before Xcode signs the app.
      - name: Sign th
        script: codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/th"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sandipchitale.TalkingHead
        PRODUCT_NAME: TalkingHead
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Talking Head
        # A menu bar applet: no Dock icon or app menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Off so `th` can read any file passed on the command line.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  TalkingHeadTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TalkingHeadTests]
    dependencies:
      - target: TalkingHead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sandipchitale.TalkingHeadTests
        GENERATE_INFOPLIST_FILE: YES
